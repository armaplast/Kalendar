<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plány jázd – firemné autá</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  /* ── RESET & BASE ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:  #639922; --green-bg:  #EAF3DE; --green-dark:  #173404;
    --blue:   #185FA5; --blue-bg:   #E6F1FB; --blue-dark:   #042C53;
    --purple: #534AB7; --purple-bg: #EEEDFE; --purple-dark: #26215C;
    --red-bg: #FCEBEB; --red-dark:  #501313; --red-border:  #A32D2D;
    --orange-bg: #FEF3E2; --orange-dark: #412402; --orange-border: #BA7517;
    --holiday-bg: #FFF8F0; --holiday-text: #854F0B;
    --border: #ddd; --radius: 8px; --radius-lg: 12px;
    --text: #1a1a1a; --text2: #555; --text3: #999;
    --bg: #fff; --bg2: #f5f5f5; --bg3: #fafafa;
    --today-bg: #378ADD; --today-text: #E6F1FB;
    --weekend: #E24B4A;
    --shadow: 0 2px 12px rgba(0,0,0,0.10);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg3); }
  a { color: inherit; text-decoration: none; }

  /* ── LAYOUT ── */
  .app { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  /* ── HEADER ── */
  .hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 1.25rem; }
  .hdr-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hdr h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .month-nav { display: flex; align-items: center; gap: 5px; }
  .month-nav button { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font-size: 12px; color: var(--text); }
  .month-nav button:hover { background: var(--bg2); }
  .month-label { font-size: 15px; font-weight: 600; min-width: 130px; text-align: center; }
  .hdr-right { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 6px 13px; border-radius: var(--radius); font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover { background: var(--bg2); }
  .btn.green { border-color: var(--green); background: var(--green-bg); color: var(--green-dark); }
  .btn.green:hover { opacity: .85; }

  /* ── LEGEND ── */
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* ── CALENDAR ── */
  .cal { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg); box-shadow: var(--shadow); }
  .dow-row { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--bg2); border-bottom: 1px solid var(--border); }
  .dow-cell { text-align: center; padding: 8px 4px; font-size: 11px; font-weight: 600; color: var(--text2); border-right: 1px solid var(--border); }
  .dow-cell:last-child { border-right: none; }
  .dow-cell.we { color: var(--weekend); }
  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); }
  .day-cell { min-height: 90px; padding: 5px 4px; border-right: 1px solid var(--border); background: var(--bg); cursor: pointer; overflow: hidden; }
  .day-cell:last-child { border-right: none; }
  .day-cell:hover { background: var(--bg3); }
  .day-cell.holiday-day { background: var(--holiday-bg); }
  .day-num { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .day-num.today { background: var(--today-bg); color: var(--today-text); }
  .day-num.other { color: var(--text3); font-weight: 400; }
  .day-num.we { color: var(--weekend); }
  .holiday-lbl { font-size: 9px; color: var(--holiday-text); font-weight: 600; line-height: 1.2; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: block; border-radius: 3px; padding: 1px 5px; font-size: 10px; font-weight: 600; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { opacity: .8; }
  .c-green  { background: #C0DD97; color: #173404; }
  .c-blue   { background: #B5D4F4; color: #042C53; }
  .c-purple { background: #CECBF6; color: #26215C; }
  .c-red    { background: #F7C1C1; color: #501313; }
  .c-orange { background: #FAC775; color: #412402; }

  /* ── STATUS BAR ── */
  .status { margin-top: 10px; font-size: 12px; color: var(--text2); min-height: 18px; display: flex; align-items: center; gap: 6px; }
  .dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }

  /* ── OVERLAY ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-start; justify-content: center; padding-top: 60px; padding-bottom: 20px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .panel { background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 480px; max-width: 95vw; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 85vh; overflow: hidden; }
  .panel-hdr { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2; flex-shrink: 0; }
  .panel-hdr h2 { font-size: 15px; font-weight: 600; }
  .close-btn { background: transparent; border: none; cursor: pointer; color: var(--text2); font-size: 20px; line-height: 1; padding: 3px 7px; border-radius: var(--radius); }
  .close-btn:hover { background: var(--bg2); }
  .panel-body { padding: 1.1rem; overflow-y: auto; flex: 1; }
  .panel-footer { padding: .9rem 1.1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0; background: var(--bg); }

  /* ── FORM ── */
  .section-lbl { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: .06em; text-transform: uppercase; margin: 1rem 0 7px; }
  .section-lbl:first-child { margin-top: 0; }
  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 3px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; font-size: 13px; font-family: inherit; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 7px 10px; }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(24,95,165,.15); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-tabs { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .type-tab { padding: 6px 12px; border-radius: var(--radius); font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text2); font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
  .type-tab.active-car    { background: var(--green-bg);  color: var(--green-dark);  border-color: var(--green);  font-weight: 600; }
  .type-tab.active-vacation { background: var(--red-bg);  color: var(--red-dark);   border-color: var(--red-border); font-weight: 600; }
  .type-tab.active-note   { background: var(--orange-bg); color: var(--orange-dark); border-color: var(--orange-border); font-weight: 600; }

  /* ── CAR SELECTOR ── */
  .car-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
  .car-opt { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius); border: 1.5px solid var(--border); cursor: pointer; font-size: 13px; transition: border-color .15s, background .15s; }
  .car-opt:hover { background: var(--bg2); }
  .car-opt.sel-green  { border-color: var(--green);  background: var(--green-bg);  color: var(--green-dark);  font-weight: 600; }
  .car-opt.sel-blue   { border-color: var(--blue);   background: var(--blue-bg);   color: var(--blue-dark);   font-weight: 600; }
  .car-opt.sel-purple { border-color: var(--purple);  background: var(--purple-bg); color: var(--purple-dark); font-weight: 600; }
  .car-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ── STOPS ── */
  .stop-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .stop-dot-el { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .stop-fields { flex: 1; }
  .stop-fields input { width: 100%; font-size: 12px; font-family: inherit; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 5px 8px; margin-bottom: 4px; }
  .stop-fields textarea { width: 100%; font-size: 12px; font-family: inherit; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 5px 8px; resize: vertical; min-height: 46px; }
  .del-stop { background: transparent; border: none; cursor: pointer; color: var(--text3); padding: 3px 5px; border-radius: 4px; font-size: 16px; margin-top: 2px; }
  .del-stop:hover { color: var(--weekend); }
  .add-stop-btn { border: 1.5px dashed var(--border); background: transparent; border-radius: var(--radius); padding: 6px 12px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: inherit; width: 100%; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .add-stop-btn:hover { background: var(--bg2); }

  /* ── DETAIL VIEW ── */
  .view-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
  .vb-green  { background: var(--green-bg);  color: var(--green-dark); }
  .vb-blue   { background: var(--blue-bg);   color: var(--blue-dark); }
  .vb-purple { background: var(--purple-bg); color: var(--purple-dark); }
  .vb-red    { background: var(--red-bg);    color: var(--red-dark); }
  .vb-orange { background: var(--orange-bg); color: var(--orange-dark); }
  .drv-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--text2); }
  .detail-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .stop-name-v { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .stop-note-v { font-size: 12px; color: var(--text2); }

  /* ── FOOTER BUTTONS ── */
  .btn-save { padding: 7px 18px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit; border: 1px solid var(--blue); background: var(--blue-bg); color: var(--blue-dark); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .btn-del  { padding: 7px 13px; border-radius: var(--radius); font-size: 12px; cursor: pointer; font-family: inherit; border: 1px solid var(--red-border); background: transparent; color: var(--red-dark); display: inline-flex; align-items: center; gap: 4px; }
  .btn-del:hover { background: var(--red-bg); }
  .btn-cancel { padding: 7px 13px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .btn-cancel:hover { background: var(--bg2); }

  /* ── LOADING SPINNER ── */
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .day-cell { min-height: 60px; }
    .hdr { flex-direction: column; align-items: flex-start; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-left">
      <h1><i class="ti ti-truck"></i> Plány jázd</h1>
      <div class="month-nav">
        <button onclick="changeMonth(-1)" title="Predchádzajúci mesiac"><i class="ti ti-chevron-left"></i></button>
        <span class="month-label" id="month-label"></span>
        <button onclick="changeMonth(1)" title="Nasledujúci mesiac"><i class="ti ti-chevron-right"></i></button>
        <button onclick="goToday()" style="font-size:11px">Dnes</button>
      </div>
    </div>
    <div class="hdr-right">
      <button class="btn" onclick="openNew('note')"><i class="ti ti-note"></i> Poznámka</button>
      <button class="btn" onclick="openNew('vacation')"><i class="ti ti-beach"></i> Dovolenka</button>
      <button class="btn green" onclick="openNew('car')"><i class="ti ti-truck"></i> Nová jazda</button>
    </div>
  </div>

  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#97C459"></div>Iveco Daily (skriňa)</div>
    <div class="leg"><div class="leg-dot" style="background:#85B7EB"></div>Iveco Daily (valník)</div>
    <div class="leg"><div class="leg-dot" style="background:#AFA9EC"></div>Citroën Jumpy</div>
    <div class="leg"><div class="leg-dot" style="background:#F09595"></div>Dovolenka</div>
    <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>Poznámka</div>
    <div class="leg"><div class="leg-dot" style="background:#FAC775;border:1px solid #BA7517"></div>Štátny sviatok</div>
  </div>

  <div class="cal">
    <div class="dow-row">
      <div class="dow-cell">Po</div><div class="dow-cell">Ut</div><div class="dow-cell">St</div>
      <div class="dow-cell">Št</div><div class="dow-cell">Pi</div>
      <div class="dow-cell we">So</div><div class="dow-cell we">Ne</div>
    </div>
    <div id="weeks"></div>
  </div>

  <div class="status" id="status-bar"><span class="dot-pulse"></span> Načítavam dáta…</div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-hdr">
      <h2 id="panel-title">Detail</h2>
      <button class="close-btn" onclick="closeOverlay()" title="Zavrieť"><i class="ti ti-x"></i></button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   ⚙️  NASTAVENIE — SEM VLOŽ SVOJ API KĽÚČ
   ═══════════════════════════════════════════════ */
const JSONBIN_API_KEY = '$2a$10$YkXbeDA0jP359L35WWu6Su7RAgVXE58ioT8wSiAPTr6hL4AbbB6/a';
const JSONBIN_BIN_ID  = '';   // nechaj prázdne pri prvom spustení — vytvorí sa automaticky

/* ═══════════════════════════════════════════════
   DÁTA
═══════════════════════════════════════════════ */
const CARS = [
  { id:1, name:'Iveco Daily (skriňa)',  chipClass:'c-green',  vcClass:'vb-green',  dot:'#639922', selClass:'sel-green',  dotLeg:'#97C459' },
  { id:2, name:'Iveco Daily (valník)',  chipClass:'c-blue',   vcClass:'vb-blue',   dot:'#185FA5', selClass:'sel-blue',   dotLeg:'#85B7EB' },
  { id:3, name:'Citroën Jumpy',         chipClass:'c-purple', vcClass:'vb-purple', dot:'#534AB7', selClass:'sel-purple', dotLeg:'#AFA9EC' },
];
const DRIVERS = [
  { id:1, name:'Ján Novák' }, { id:2, name:'Marta Kováčová' },
  { id:3, name:'Peter Horváth' }, { id:4, name:'Eva Blahová' }, { id:5, name:'Tomáš Sloboda' },
];
const MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];

let events = [];
let nextId = 1;
let viewYear, viewMonth;
let currentType = 'car';
let currentEditId = null;
let holidaysCache = {};
let binId = JSONBIN_BIN_ID;
let saveTimeout = null;
const today = new Date();

/* ═══════════════════════════════════════════════
   JSONBIN API
═══════════════════════════════════════════════ */
function apiHeaders() {
  return {
    'Content-Type': 'application/json',
    'X-Master-Key': JSONBIN_API_KEY,
    'X-Bin-Versioning': 'false'
  };
}

async function loadData() {
  setStatus('Načítavam dáta…', true);
  try {
    // Ak nemáme bin ID, skús nájsť existujúci alebo vytvor nový
    if (!binId) {
      await createBin();
      return;
    }
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: apiHeaders() });
    if (!res.ok) throw new Error('Chyba načítania');
    const data = await res.json();
    const rec = data.record;
    events = rec.events || [];
    nextId  = rec.nextId  || (events.length ? Math.max(...events.map(e=>e.id))+1 : 1);
    setStatus('Dáta načítané', false);
    render();
  } catch(e) {
    setStatus('Chyba: ' + e.message, false);
    render();
  }
}

async function createBin() {
  setStatus('Vytváram databázu…', true);
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { ...apiHeaders(), 'X-Bin-Name': 'firemne-jazdy', 'X-Bin-Private': 'true' },
      body: JSON.stringify({ events: [], nextId: 1 })
    });
    if (!res.ok) throw new Error('Nepodarilo sa vytvoriť databázu. Skontroluj API kľúč.');
    const data = await res.json();
    binId = data.metadata.id;
    // Ulož bin ID do localStorage pre budúce návštevy
    localStorage.setItem('jazdy_bin_id', binId);
    setStatus('Databáza vytvorená ✓ Bin ID: ' + binId, false);
    render();
  } catch(e) {
    setStatus('❌ Chyba: ' + e.message, false);
  }
}

function scheduleSave() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveData, 800);
}

async function saveData() {
  if (!binId) { await createBin(); return; }
  setStatus('Ukladám…', true);
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: 'PUT',
      headers: apiHeaders(),
      body: JSON.stringify({ events, nextId })
    });
    if (!res.ok) throw new Error('Chyba ukladania');
    setStatus('Uložené ✓', false);
  } catch(e) {
    setStatus('❌ Chyba ukladania: ' + e.message, false);
  }
}

function setStatus(msg, loading) {
  const bar = document.getElementById('status-bar');
  bar.innerHTML = loading
    ? `<span class="spinner"></span> ${msg}`
    : `<span class="dot-pulse"></span> ${msg}`;
}

/* ═══════════════════════════════════════════════
   ŠTÁTNE SVIATKY SR
═══════════════════════════════════════════════ */
function getHolidays(year) {
  if (holidaysCache[year]) return holidaysCache[year];
  function p(n){return String(n).padStart(2,'0')}
  function fmt(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
      m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31), dy=((h+l-7*m+114)%31)+1;
    return new Date(y,mo-1,dy);
  }
  const fixed = [
    [1,1,'Nový rok / Deň vzniku SR'],[1,6,'Zjavenie Pána'],
    [5,1,'Sviatok práce'],[5,8,'Deň víťazstva nad fašizmom'],
    [7,5,'Sv. Cyril a Metod'],[8,29,'Výročie SNP'],
    [9,1,'Deň Ústavy SR'],[9,15,'Sedembolestná P. Mária'],
    [11,1,'Sviatok Všetkých svätých'],[11,17,'Deň boja za slobodu'],
    [12,24,'Štedrý deň'],[12,25,'1. sviatok vianočný'],[12,26,'2. sviatok vianočný'],
  ];
  const res = {};
  fixed.forEach(([m,d,n]) => res[year+'-'+p(m)+'-'+p(d)] = n);
  const E = easter(year);
  const gf = new Date(E); gf.setDate(gf.getDate()-2); res[fmt(gf)] = 'Veľký piatok';
  const em = new Date(E); em.setDate(em.getDate()+1); res[fmt(em)] = 'Veľkonočný pondelok';
  holidaysCache[year] = res;
  return res;
}

/* ═══════════════════════════════════════════════
   RENDER KALENDÁRA
═══════════════════════════════════════════════ */
function p2(n){return String(n).padStart(2,'0')}
function fmtD(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function inRange(date,from,to){return date>=from&&date<=to}
function init(){
  // Pokus načítať bin ID z localStorage
  if (!binId) binId = localStorage.getItem('jazdy_bin_id') || '';
  viewYear=today.getFullYear(); viewMonth=today.getMonth();
  if (JSONBIN_API_KEY === 'SEM_VLOZ_SVOJ_MASTER_KEY') {
    setStatus('⚠️ Vlož svoj API kľúč do súboru (riadok JSONBIN_API_KEY)', false);
    render();
    return;
  }
  loadData();
  // Automatické obnovovanie každých 30 sekúnd
  setInterval(loadData, 30000);
}
function changeMonth(d){viewMonth+=d;if(viewMonth<0){viewMonth=11;viewYear--;}else if(viewMonth>11){viewMonth=0;viewYear++;}render()}
function goToday(){viewYear=today.getFullYear();viewMonth=today.getMonth();render()}

function render(){
  document.getElementById('month-label').textContent = MONTHS[viewMonth]+' '+viewYear;
  const holidays = getHolidays(viewYear);
  const first = new Date(viewYear, viewMonth, 1);
  let dow = first.getDay(); dow = (dow===0)?6:dow-1;
  const dim = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevDim = new Date(viewYear, viewMonth, 0).getDate();
  const cells = [];
  for(let i=dow-1;i>=0;i--){const d=new Date(viewYear,viewMonth-1,prevDim-i);cells.push({date:fmtD(d),day:prevDim-i,cur:false,we:d.getDay()===0||d.getDay()===6});}
  for(let d=1;d<=dim;d++){const dt=new Date(viewYear,viewMonth,d);cells.push({date:fmtD(dt),day:d,cur:true,we:dt.getDay()===0||dt.getDay()===6});}
  while(cells.length%7!==0){const dt=new Date(viewYear,viewMonth+1,cells.length-dow-dim+1);cells.push({date:fmtD(dt),day:dt.getDate(),cur:false,we:dt.getDay()===0||dt.getDay()===6});}
  const weeksEl = document.getElementById('weeks');
  weeksEl.innerHTML = '';
  for(let w=0;w<cells.length/7;w++){
    const row = document.createElement('div'); row.className='week-row';
    for(let d=0;d<7;d++){
      const c = cells[w*7+d];
      const isToday = c.date===fmtD(today);
      const holiday = holidays[c.date];
      const cell = document.createElement('div');
      cell.className = 'day-cell' + (holiday?' holiday-day':'');
      const numDiv = document.createElement('div');
      numDiv.className = 'day-num' + (isToday?' today':'') + (!c.cur?' other':'') + (c.we&&!isToday?' we':'');
      numDiv.textContent = c.day;
      cell.appendChild(numDiv);
      if(holiday){const hl=document.createElement('div');hl.className='holiday-lbl';hl.title=holiday;hl.textContent=holiday;cell.appendChild(hl);}
      events.filter(e=>inRange(c.date,e.dateFrom,e.dateTo)).forEach(ev=>{
        const chip=document.createElement('div');
        chip.className='chip '+chipClass(ev);
        chip.textContent=chipLabel(ev); chip.title=ev.title;
        chip.onclick=(e)=>{e.stopPropagation();openDetail(ev.id)};
        cell.appendChild(chip);
      });
      cell.onclick=()=>openNew('car',c.date);
      row.appendChild(cell);
    }
    weeksEl.appendChild(row);
  }
}

function chipClass(ev){
  if(ev.type==='vacation') return 'c-red';
  if(ev.type==='note') return 'c-orange';
  const car = CARS.find(c=>c.id===ev.carId);
  return car ? car.chipClass : 'c-green';
}
function chipLabel(ev){
  if(ev.type==='vacation'){const d=DRIVERS.find(x=>x.id===ev.driverId);return (d?d.name.split(' ')[0]:'')+' – dovolenka';}
  if(ev.type==='note') return ev.title;
  const car=CARS.find(c=>c.id===ev.carId);
  return (car?car.name+' – ':'')+ev.title;
}

/* ═══════════════════════════════════════════════
   DETAIL
═══════════════════════════════════════════════ */
function openDetail(evId){
  const ev=events.find(e=>e.id===evId); if(!ev) return;
  currentEditId=evId;
  document.getElementById('panel-title').textContent='Detail';
  const body=document.getElementById('panel-body');
  if(ev.type==='car'){
    const car=CARS.find(c=>c.id===ev.carId), drv=DRIVERS.find(d=>d.id===ev.driverId);
    const dot=car?car.dot:'#639922';
    const stopsHtml=(ev.stops||[]).map((s,i)=>`
      <div class="stop-row">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="stop-dot-el" style="background:${dot}"></div>
          ${i<ev.stops.length-1?`<div style="width:1px;flex:1;background:#ddd;margin-top:2px"></div>`:''}
        </div>
        <div style="flex:1;padding-bottom:${i<ev.stops.length-1?'10px':'0'}">
          <div class="stop-name-v">${s.name}</div>
          ${s.note?`<div class="stop-note-v">${s.note}</div>`:''}
        </div>
      </div>`).join('');
    body.innerHTML=`
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">
        <span class="view-badge ${car?car.vcClass:'vb-green'}"><i class="ti ti-truck" style="font-size:13px"></i>${car?car.name:'—'}</span>
        <span class="drv-badge"><i class="ti ti-user" style="font-size:12px"></i>${drv?drv.name:'—'}</span>
        <span style="font-size:11px;color:var(--text2);margin-left:auto">${ev.dateFrom}${ev.dateTo!==ev.dateFrom?' → '+ev.dateTo:''}</span>
      </div>
      <div class="detail-title">${ev.title}</div>
      <div class="section-lbl">Plán trasy</div>
      ${stopsHtml||'<span style="font-size:12px;color:var(--text2)">Žiadne zastávky</span>'}`;
  } else if(ev.type==='vacation'){
    const drv=DRIVERS.find(d=>d.id===ev.driverId);
    body.innerHTML=`
      <span class="view-badge vb-red"><i class="ti ti-beach" style="font-size:13px"></i>Dovolenka</span>
      <div class="detail-title">${ev.title}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px"><i class="ti ti-user" style="font-size:13px;margin-right:4px"></i>${drv?drv.name:'—'}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px"><i class="ti ti-calendar" style="font-size:13px;margin-right:4px"></i>${ev.dateFrom} → ${ev.dateTo}</div>
      ${ev.note?`<div class="section-lbl">Poznámka</div><div style="font-size:13px">${ev.note}</div>`:''}`;
  } else {
    body.innerHTML=`
      <span class="view-badge vb-orange"><i class="ti ti-note" style="font-size:13px"></i>Poznámka</span>
      <div class="detail-title">${ev.title}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px"><i class="ti ti-calendar" style="font-size:13px;margin-right:4px"></i>${ev.dateFrom}${ev.dateTo!==ev.dateFrom?' → '+ev.dateTo:''}</div>
      ${ev.note?`<div style="font-size:13px">${ev.note}</div>`:''}`;
  }
  document.getElementById('panel-footer').innerHTML=`
    <button class="btn-del" onclick="deleteEvent(${evId})"><i class="ti ti-trash"></i> Zmazať</button>
    <div style="display:flex;gap:6px">
      <button class="btn-cancel" onclick="closeOverlay()">Zavrieť</button>
      <button class="btn-save" onclick="openEdit(${evId})"><i class="ti ti-edit"></i> Upraviť</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

function openEdit(evId){const ev=events.find(e=>e.id===evId);if(!ev)return;currentEditId=evId;renderForm(ev);}

/* ═══════════════════════════════════════════════
   FORM
═══════════════════════════════════════════════ */
function openNew(type,dateStr){
  currentType=type||'car'; currentEditId=null;
  const d=dateStr||fmtD(today);
  renderForm({id:null,type:currentType,carId:CARS[0].id,driverId:DRIVERS[0].id,dateFrom:d,dateTo:d,title:'',stops:[{name:'',note:''}],note:''});
  document.getElementById('overlay').classList.add('open');
}

function renderForm(ev){
  currentType=ev.type||'car';
  document.getElementById('panel-title').textContent=ev.id?'Upraviť':'Nová udalosť';
  const drvOpts=DRIVERS.map(d=>`<option value="${d.id}"${ev.driverId===d.id?' selected':''}>${d.name}</option>`).join('');
  document.getElementById('panel-body').innerHTML=`
    <div class="section-lbl">Typ udalosti</div>
    <div class="type-tabs">
      <button class="type-tab${currentType==='car'?' active-car':''}" onclick="switchType('car')"><i class="ti ti-truck" style="font-size:12px"></i>Jazda</button>
      <button class="type-tab${currentType==='vacation'?' active-vacation':''}" onclick="switchType('vacation')"><i class="ti ti-beach" style="font-size:12px"></i>Dovolenka</button>
      <button class="type-tab${currentType==='note'?' active-note':''}" onclick="switchType('note')"><i class="ti ti-note" style="font-size:12px"></i>Poznámka</button>
    </div>
    <div id="type-fields"></div>`;
  document.getElementById('panel-footer').innerHTML=`
    ${ev.id?`<button class="btn-del" onclick="deleteEvent(${ev.id})"><i class="ti ti-trash"></i> Zmazať</button>`:'<span></span>'}
    <div style="display:flex;gap:6px">
      <button class="btn-cancel" onclick="closeOverlay()">Zrušiť</button>
      <button class="btn-save" onclick="saveEvent()"><i class="ti ti-device-floppy"></i> Uložiť</button>
    </div>`;
  renderTypeFields(ev,drvOpts);
  document.getElementById('overlay').classList.add('open');
}

function renderTypeFields(ev,drvOpts){
  const tf=document.getElementById('type-fields'); if(!tf) return;
  if(currentType==='car'){
    const carGrid=CARS.map(c=>`
      <div class="car-opt${ev.carId===c.id?' '+c.selClass:''}" onclick="selectCar(${c.id},this)" data-carid="${c.id}">
        <div class="car-dot" style="background:${c.dotLeg}"></div>${c.name}
      </div>`).join('');
    tf.innerHTML=`
      <div class="section-lbl">Výber auta</div>
      <div class="car-grid">${carGrid}</div>
      <input type="hidden" id="e-car-id" value="${ev.carId||CARS[0].id}">
      <div class="form-row"><label>Vodič</label><select id="e-drv-sel">${drvOpts}</select></div>
      <div class="row2">
        <div class="form-row"><label>Dátum od</label><input type="date" id="e-from" value="${ev.dateFrom}"></div>
        <div class="form-row"><label>Do</label><input type="date" id="e-to" value="${ev.dateTo}"></div>
      </div>
      <div class="form-row"><label>Názov jazdy</label><input type="text" id="e-title" value="${ev.title||''}" placeholder="napr. Vývozy Bratislava"></div>
      <div class="section-lbl">Zastávky a plán trasy</div>
      <div id="stops-list"></div>
      <button class="add-stop-btn" onclick="addStop()"><i class="ti ti-plus"></i> Pridať zastávku</button>`;
    const sl=document.getElementById('stops-list');
    (ev.stops||[{name:'',note:''}]).forEach(s=>appendStop(sl,s.name,s.note));
  } else if(currentType==='vacation'){
    tf.innerHTML=`
      <div class="form-row"><label>Zamestnanec</label><select id="e-drv-sel">${drvOpts}</select></div>
      <div class="row2">
        <div class="form-row"><label>Od</label><input type="date" id="e-from" value="${ev.dateFrom}"></div>
        <div class="form-row"><label>Do</label><input type="date" id="e-to" value="${ev.dateTo}"></div>
      </div>
      <div class="form-row"><label>Popis</label><input type="text" id="e-title" value="${ev.title||''}" placeholder="napr. Dovolenka – Ján Novák"></div>
      <div class="form-row"><label>Poznámka</label><textarea id="e-note" placeholder="napr. Zastupuje, kontakt…">${ev.note||''}</textarea></div>`;
  } else {
    tf.innerHTML=`
      <div class="row2">
        <div class="form-row"><label>Od</label><input type="date" id="e-from" value="${ev.dateFrom}"></div>
        <div class="form-row"><label>Do</label><input type="date" id="e-to" value="${ev.dateTo}"></div>
      </div>
      <div class="form-row"><label>Nadpis</label><input type="text" id="e-title" value="${ev.title||''}" placeholder="napr. STK – Iveco Daily"></div>
      <div class="form-row"><label>Text poznámky</label><textarea id="e-note" placeholder="Podrobnosti…">${ev.note||''}</textarea></div>`;
  }
}

function selectCar(id,el){
  document.getElementById('e-car-id').value=id;
  const car=CARS.find(c=>c.id===id);
  document.querySelectorAll('.car-opt').forEach(o=>o.className='car-opt');
  if(car) el.classList.add(car.selClass);
}

function switchType(t){
  currentType=t;
  const from=document.getElementById('e-from')?document.getElementById('e-from').value:fmtD(today);
  const to=document.getElementById('e-to')?document.getElementById('e-to').value:fmtD(today);
  const title=document.getElementById('e-title')?document.getElementById('e-title').value:'';
  const drv=document.getElementById('e-drv-sel')?+document.getElementById('e-drv-sel').value:DRIVERS[0].id;
  const carId=document.getElementById('e-car-id')?+document.getElementById('e-car-id').value:CARS[0].id;
  document.querySelectorAll('.type-tab').forEach(b=>b.className='type-tab');
  const activeMap={car:'active-car',vacation:'active-vacation',note:'active-note'};
  document.querySelectorAll('.type-tab')[['car','vacation','note'].indexOf(t)].classList.add(activeMap[t]);
  const drvOpts=DRIVERS.map(d=>`<option value="${d.id}"${d.id===drv?' selected':''}>${d.name}</option>`).join('');
  renderTypeFields({id:currentEditId,type:t,carId,driverId:drv,dateFrom:from,dateTo:to,title,stops:[{name:'',note:''}],note:''},drvOpts);
}

function appendStop(container,name,note){
  const div=document.createElement('div'); div.className='stop-row';
  div.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;padding-top:6px">
      <div class="stop-dot-el" style="background:#639922"></div>
    </div>
    <div class="stop-fields" style="padding-bottom:8px">
      <input type="text" placeholder="Firma / miesto zastávky" value="${name||''}">
      <textarea placeholder="Čo naložiť, č. objednávky, kontakt…">${note||''}</textarea>
    </div>
    <button class="del-stop" onclick="this.closest('.stop-row').remove()" title="Odstrániť zastávku"><i class="ti ti-x"></i></button>`;
  container.appendChild(div);
}
function addStop(){const sl=document.getElementById('stops-list');if(sl)appendStop(sl,'','');}

function saveEvent(){
  const from=document.getElementById('e-from')?document.getElementById('e-from').value:'';
  const to=document.getElementById('e-to')?document.getElementById('e-to').value:from;
  const title=(document.getElementById('e-title')?document.getElementById('e-title').value.trim():'')||'Udalosť';
  if(!from){alert('Zadajte dátum');return;}
  let data={type:currentType,dateFrom:from,dateTo:to||from,title};
  if(currentType==='car'){
    data.carId=+(document.getElementById('e-car-id')||{value:CARS[0].id}).value;
    data.driverId=+(document.getElementById('e-drv-sel')||{value:DRIVERS[0].id}).value;
    const rows=document.getElementById('stops-list')?document.getElementById('stops-list').querySelectorAll('.stop-row'):[];
    data.stops=[];
    rows.forEach(row=>{const ins=row.querySelectorAll('input,textarea');if(ins[0]&&ins[0].value.trim())data.stops.push({name:ins[0].value.trim(),note:ins[1]?ins[1].value.trim():''});});
  } else {
    data.driverId=+(document.getElementById('e-drv-sel')||{value:DRIVERS[0].id}).value;
    data.note=document.getElementById('e-note')?document.getElementById('e-note').value:'';
  }
  if(currentEditId!==null){
    const idx=events.findIndex(e=>e.id===currentEditId);
    if(idx>-1) events[idx]={...events[idx],...data};
  } else {
    events.push({id:nextId++,...data});
  }
  closeOverlay(); render(); scheduleSave();
}

function deleteEvent(evId){
  if(!confirm('Naozaj zmazať túto udalosť?')) return;
  events=events.filter(e=>e.id!==evId);
  closeOverlay(); render(); scheduleSave();
}
function closeOverlay(){document.getElementById('overlay').classList.remove('open');}

/* ═══════════════════════════════════════════════
   ŠTART
═══════════════════════════════════════════════ */
init();
</script>
</body>
</html>
